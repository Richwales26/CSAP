services:
  postgres:
    image: postgres:16-alpine
    container_name: csap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-csap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csap_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-csap}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csap} -d ${POSTGRES_DB:-csap}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
